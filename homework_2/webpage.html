<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>OpenClip Team-01</title>
    <style>
        .infoDiv {
            margin: 0 auto;
            border: 3px solid black;
            width: fit-content;
            padding-left: 2px;
            padding-right: 2px;
            background: antiquewhite;
        }

        .bar-graph-container {
            width: 1000px;
        }

        .bar-graph {
            max-width: 100%;
            aspect-ratio: 5 / 2;
            margin: 0;
            padding: 40px;
            border: 2px solid #11131B;
            background: #353C59;
            color: #fff;
            border-radius: 10px;
            box-shadow: 4px 4px 12px 1px rgba(0, 0, 0, .3);
        }

        .bar-graph-title {
            font-size: 2rem;
            font-weight: 700;
        }

        .bar-graph-data {
            height: 100%;
            border-top: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            position: relative;
            margin-top: 2rem;
        }

        .bar-graph-data:before,
        .bar-graph-data:after {
            content: '';
            position: absolute;
            top: 33.333%;
            width: 100%;
            border-top: 1px solid #ccc;
        }

        .bar-graph-data:after {
            top: 66.666%
        }

        .bar-graph-bar {
            width: 50px;
            border-radius: 10px 10px 0 0;
            height: var(--value, 1px);
            max-height: 100%;
            position: relative;
            z-index: 2;
            background-color: var(--bg);
            border: 2px solid var(--bg);
            border-bottom: none;
            box-shadow: inset 0 0 18px 2px rgba(255, 255, 255, .35);
            background-image: linear-gradient(
                    45deg,
                    rgba(255, 255, 255, 0.15) 25%,
                    transparent 25%,
                    transparent 50%,
                    rgba(255, 255, 255, 0.15) 50%,
                    rgba(255, 255, 255, .15) 75%,
                    transparent 75%,
                    transparent
            );
            background-size: 12px 12px;
        }

        .bar-graph-bar:after {
            content: attr(title);
            position: absolute;
            bottom: calc(100% + 6px);
            font-size: .875rem;
            font-weight: 600;
            text-align: center;
            display: block;
            width: 100%;
        }

        .bar-graph-legend {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1rem;
            row-gap: 6px;
            flex-wrap: wrap;
            margin-top: 32px;
        }

        .bar-graph-key {
            display: flex;
            align-items: center;
        }

        .bar-graph-key:before {
            content: '';
            width: 16px;
            height: 16px;
            margin-right: 11px;
            background-color: var(--bg);
        }

        .bar-graph-bar,
        .bar-graph-key:before {
            --bg: #e50d0d;
        }

        .bar-graph-bar:nth-child(2),
        .bar-graph-key:nth-child(2):before {
            --bg: #18C00E;
        }

        .bar-graph-bar:nth-child(3),
        .bar-graph-key:nth-child(3):before {
            --bg: #000000;
        }

        .bar-graph-bar:nth-child(4),
        .bar-graph-key:nth-child(4):before {
            --bg: #cd68fd;
        }

        .bar-graph-bar:nth-child(5),
        .bar-graph-key:nth-child(5):before {
            --bg: #0a2ee4;
        }

        .bar-graph-bar:nth-child(6),
        .bar-graph-key:nth-child(6):before {
            --bg: #f6c922;
        }

        .bar-graph-bar:nth-child(7),
        .bar-graph-key:nth-child(7):before {
            --bg: #d1d1d1;
        }

        @media (max-width: 767px) {
            body {
                padding: 32px 0;
            }

            .bar-graph-container {
                max-width: 100%;
                padding: 16px;
            }

            .bar-graph {
                padding: 16px;
            }

            .bar-graph-bar {
                width: 25px;
                border-radius: 4px 4px 0 0;
            }

            .bar-graph-legend {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>

    <div style="margin: auto" class="bar-graph-container">
        <figure class="bar-graph">
            <figcaption class="bar-graph-title">Detected Emotions</figcaption>

            <div id="graph-data" class="bar-graph-data">
                <div class="bar-graph-bar" title="0%" style="--value: 0%;"></div>
                <div class="bar-graph-bar" title="0%" style="--value: 0%;"></div>
                <div class="bar-graph-bar" title="0%" style="--value: 0%;"></div>
                <div class="bar-graph-bar" title="0%" style="--value: 0%;"></div>
                <div class="bar-graph-bar" title="0%" style="--value: 0%;"></div>

                <div class="bar-graph-bar" title="0%" style="--value: 0%;"></div>
            </div>

            <div class="bar-graph-legend">
                <div class="bar-graph-key">Anger</div>
                <div class="bar-graph-key">Disgust</div>
                <div class="bar-graph-key">Fear</div>
                <div class="bar-graph-key">Happiness</div>
                <div class="bar-graph-key">Sadness</div>
                <div class="bar-graph-key">Surprise</div>
                <div class="bar-graph-key">Neutral</div>
            </div>
        </figure>
    </div>


    <script>
        const predictApi = "http://127.0.0.1:8000/predict"

        document.getElementById('imageUpload').addEventListener('change', function () {
            let file = this.files[0];
            let reader = new FileReader();
            reader.onload = function (event) {
                let base64String = event.target.result;

                fetch(predictApi, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        image: base64String,
                        classes: []
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        console.log(data)

                        const error_text = document.getElementById("error-text")
                        if (data.hasOwnProperty("detail")) {
                            error_text.hidden = false
                            error_text.innerText = data.detail
                            return
                        } else {
                            error_text.hidden = true
                            error_text.innerText = ""
                        }

                        document.getElementById('image-view').src = base64String;

                        const emotions = data.emotions;

                        function rounding(value) {
                            return Math.round(value * 10_000) / 100
                        }

                        const anger = rounding(emotions.anger)
                        const disgust = rounding(emotions.disgust)
                        const fear = rounding(emotions.fear)
                        const happiness = rounding(emotions.happiness)
                        const sadness = rounding(emotions.sadness)
                        const surprise = rounding(emotions.surprise)
                        const neutral = rounding(emotions.neutral)

                        document.getElementById("graph-data").innerHTML =
                            `<div class="bar-graph-bar" title="${anger}%" style="--value: ${anger}%;"></div>
                                <div class="bar-graph-bar" title="${disgust}%" style="--value: ${disgust}%;"></div>
                                <div class="bar-graph-bar" title="${fear}%" style="--value: ${fear}%;"></div>
                                <div class="bar-graph-bar" title="${happiness}%" style="--value: ${happiness}%;"></div>
                                <div class="bar-graph-bar" title="${sadness}%" style="--value: ${sadness}%;"></div>
                                <div class="bar-graph-bar" title="${surprise}%" style="--value: ${surprise}%;"></div>
                                <div class="bar-graph-bar" title="${neutral}%" style="--value: ${neutral}%;"></div>`
                    })
            }
            reader.readAsDataURL(file);
        })
    </script>
</div>

<div style="text-align: center;" id="infoSection">
    <h4>Model info</h4>
    <div class="infoDiv" id="model-info">
    </div>

    <script>
        const apiInfo = "http://127.0.0.1:8000/info"
        fetch(apiInfo)
            .then(response => response.json())
            .then(data => {
                const team = data.team;
                const model_version = data.model_version;
                const max_image_size = data.max_image_size;
                const max_classes = data.max_classes;

                document.getElementById("model-info").innerHTML =
                    `<p><strong>Team:</strong> ${team}</p>
                <p><strong>Model version:</strong> ${model_version}</p>
                <p><strong>Max image size:</strong> ${max_image_size}</p>
                <p><strong>Max classes:</strong> ${max_classes}</p>`;
            })

    </script>
</div>
